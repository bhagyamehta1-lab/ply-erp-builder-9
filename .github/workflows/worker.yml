name: Private ERP Isolated Worker

on:
  repository_dispatch:
    types: [plymetrix-ci]

permissions:
  contents: read

concurrency:
  group: plymetrix-${{ github.repository }}-${{ github.event.client_payload.commit_sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ${{ github.event.client_payload.suite == 'windows-frontend-build' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 55
    env:
      PRIVATE_REPO: bhagyamehta1-lab/PLY_ERP
      SHA: ${{ github.event.client_payload.commit_sha }}
      SUITE: ${{ github.event.client_payload.suite }}
      EXPECTED_REPO: ${{ github.event.client_payload.builder_repo }}
    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA."; exit 1; }
          [[ "$EXPECTED_REPO" == "${GITHUB_REPOSITORY#*/}" ]] || { echo "Builder repository mismatch."; exit 1; }
          case "$SUITE" in
            frontend-typecheck|frontend-build|tauri-rust-tests|storage-poc-tests|windows-frontend-build|rust-format-check|cargo-metadata|frontend-and-rust|dependency-audit|acceptance-smoke) ;;
            *) echo "Unsupported suite."; exit 1 ;;
          esac

      - name: Report pending status to private commit
        env:
          STATUS_TOKEN: ${{ secrets.PRIVATE_ERP_STATUS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg context "ci-bridge/$SUITE" --arg description "Worker started on $GITHUB_REPOSITORY" \
            '{state:"pending",context:$context,description:$description}')
          code=$(curl -sS -o "$RUNNER_TEMP/pending.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO/statuses/$SHA" -d "$body")
          [[ "$code" == "201" ]] || { echo "Pending status update failed (HTTP $code)."; exit 1; }

      - name: Checkout exact private source commit
        uses: actions/checkout@v4
        with:
          repository: bhagyamehta1-lab/PLY_ERP
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ secrets.PRIVATE_ERP_READ_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Set up Node.js
        if: contains(fromJSON('["frontend-typecheck","frontend-build","windows-frontend-build","frontend-and-rust","dependency-audit","acceptance-smoke"]'), env.SUITE)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        if: contains(fromJSON('["tauri-rust-tests","storage-poc-tests","rust-format-check","cargo-metadata","frontend-and-rust","acceptance-smoke"]'), env.SUITE)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux' && contains(fromJSON('["tauri-rust-tests","frontend-and-rust","acceptance-smoke"]'), env.SUITE)
        shell: bash
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev >/dev/null 2>&1

      - name: Install frontend dependencies
        if: contains(fromJSON('["frontend-typecheck","frontend-build","windows-frontend-build","frontend-and-rust","dependency-audit","acceptance-smoke"]'), env.SUITE)
        working-directory: private-source
        shell: bash
        run: |
          if npm install --no-audit --no-fund >"$RUNNER_TEMP/private-npm-install.log" 2>&1; then
            echo "Frontend dependencies installed."
          else
            echo "Frontend dependency installation failed; private compiler/package logs suppressed."
            exit 1
          fi

      - name: Frontend typecheck
        if: contains(fromJSON('["frontend-typecheck","frontend-and-rust","acceptance-smoke"]'), env.SUITE)
        working-directory: private-source
        shell: bash
        run: |
          npm run typecheck >"$RUNNER_TEMP/private-typecheck.log" 2>&1 || { echo "Frontend typecheck failed; private output suppressed."; exit 1; }
          echo "Frontend typecheck passed."

      - name: Frontend production build
        if: contains(fromJSON('["frontend-build","windows-frontend-build","frontend-and-rust","acceptance-smoke"]'), env.SUITE)
        working-directory: private-source
        shell: bash
        run: |
          npm run build >"$RUNNER_TEMP/private-frontend-build.log" 2>&1 || { echo "Frontend build failed; private output suppressed."; exit 1; }
          echo "Frontend production build passed."

      - name: Tauri application Rust tests
        if: contains(fromJSON('["tauri-rust-tests","frontend-and-rust","acceptance-smoke"]'), env.SUITE)
        working-directory: private-source
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml >"$RUNNER_TEMP/private-tauri-tests.log" 2>&1 || { echo "Tauri Rust tests failed; private output suppressed."; exit 1; }
          echo "Tauri Rust tests passed."

      - name: Native storage proof-of-concept tests
        if: env.SUITE == 'storage-poc-tests'
        working-directory: private-source
        shell: bash
        run: |
          cargo test --manifest-path native/storage-poc/Cargo.toml >"$RUNNER_TEMP/private-storage-tests.log" 2>&1 || { echo "Storage tests failed; private output suppressed."; exit 1; }
          echo "Storage proof-of-concept tests passed."

      - name: Rust formatting check
        if: env.SUITE == 'rust-format-check'
        working-directory: private-source
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check >"$RUNNER_TEMP/private-fmt.log" 2>&1 || { echo "Rust formatting check failed; private output suppressed."; exit 1; }
          echo "Rust formatting check passed."

      - name: Cargo metadata validation
        if: env.SUITE == 'cargo-metadata'
        working-directory: private-source
        shell: bash
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps >"$RUNNER_TEMP/private-cargo-metadata.json" 2>"$RUNNER_TEMP/private-cargo-metadata.log" || { echo "Cargo metadata validation failed; private output suppressed."; exit 1; }
          echo "Cargo metadata validation passed."

      - name: Frontend dependency tree validation
        if: env.SUITE == 'dependency-audit'
        working-directory: private-source
        shell: bash
        run: |
          npm ls --depth=0 >"$RUNNER_TEMP/private-npm-tree.log" 2>&1 || { echo "Frontend dependency tree validation failed; private output suppressed."; exit 1; }
          echo "Frontend dependency tree validation passed (this is not a vulnerability audit)."

      - name: Final acceptance marker
        if: env.SUITE == 'acceptance-smoke'
        run: echo "Frontend typecheck/build and Tauri Rust tests passed for the exact private commit."

      - name: Report final status to private commit
        if: always() && env.SHA != ''
        env:
          STATUS_TOKEN: ${{ secrets.PRIVATE_ERP_STATUS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then state=success; else state=failure; fi
          body=$(jq -nc --arg state "$state" --arg context "ci-bridge/$SUITE" --arg description "Worker result: $state" \
            '{state:$state,context:$context,description:$description}')
          code=$(curl -sS -o "$RUNNER_TEMP/final-status.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO/statuses/$SHA" -d "$body")
          [[ "$code" == "201" ]] || { echo "Final status update failed (HTTP $code)."; exit 1; }
